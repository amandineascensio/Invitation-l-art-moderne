<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'art moderne · Invitation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Même direction artistique que « Le livre aux pages perdues » (version en ligne) :
   fond bleu ardoise, livre à couverture rouge brique, papier crème, photos façon polaroïd avec ruban adhésif,
   Inter pour l'interface (barre, boutons, étiquettes), Garamond pour le texte du livre. */
:root {
  color-scheme: light;
  --slate: #3d4466;
  --slate-hi: #4c547a;
  --slate-lo: #323853;
  --brick: #8a3a28;
  --brick-lo: #6e2c1e;
  --paper: #fbf8f1;
  --paper-2: #f1ebdf;
  --edge: #ddd6c8;
  --ink: #1f2328;
  --text: #46423c;
  --muted: #6f695f;
  --faint: #d8d0c1;
  --red: #b8472f;
  --mustard: #d6a443;
  --gold: #d9bf86;
  --tape: rgba(232, 200, 120, .62);
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --serif: "EB Garamond", Garamond, "Times New Roman", serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--ink); font: 400 18px/1.35 var(--serif); -webkit-font-smoothing: antialiased;
  background: radial-gradient(110% 80% at 50% 42%, var(--slate-hi), var(--slate) 55%, var(--slate-lo));
  background-color: var(--slate);
}
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
p, h1, h2 { margin: 0; font-weight: 400; }
:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.page :focus-visible { outline-color: var(--ink); }

.app { height: 100%; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }

/* ---------- Barre du haut ---------- */
.bar { flex: none; height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 4px 0; color: #fff; font-family: var(--sans); }
.rb { appearance: none; flex: none; width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.22); color: #fff; display: grid; place-items: center; cursor: pointer; text-decoration: none; transition: background .2s; }
.rb:active { background: rgba(255,255,255,.16); }
.rb svg { width: 18px; height: 18px; }
.bar-t { font: 600 13px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.72); }
.prog { flex: none; height: 32px; padding: 0 11px; border-radius: 999px; background: rgba(255,255,255,.1); display: flex; align-items: center; gap: 8px; font: 600 14px var(--sans); }
.prog .slots { display: flex; gap: 3px; }
.prog .slots i { width: 9px; height: 12px; border: 1px solid rgba(255,255,255,.5); border-radius: 1px; transition: background .4s; }
.prog .slots i.on { background: #fff; border-color: #fff; }

/* ---------- Le livre ---------- */
.stage { flex: 1; min-height: 0; padding-bottom: 12px; display: grid; }
.book {
  position: relative; height: 100%; border-radius: 10px;
  background: repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 1px, transparent 1px 3px), linear-gradient(160deg, var(--brick), var(--brick-lo));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 34px 50px -20px rgba(6,8,22,.75), 0 10px 20px -8px rgba(6,8,22,.5);
}
.pages { position: absolute; inset: 7px 9px 10px 7px; perspective: 1900px; }
.page {
  position: absolute; inset: 0; overflow: hidden;
  background: linear-gradient(90deg, rgba(0,0,0,.12), rgba(0,0,0,0) 28px), var(--paper);
  border-radius: 2px 10px 10px 2px;
  box-shadow: 1px 1px 0 var(--edge), 2px 2px 0 var(--paper), 3px 3px 0 var(--edge), 4px 4px 0 var(--paper), 5px 5px 0 var(--edge);
  padding: 18px 20px 16px 28px;
  display: flex; flex-direction: column; gap: 12px;
}
.page.rise { animation: rise .5s cubic-bezier(.2,.8,.3,1); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.title { font: 400 28px/1.1 var(--serif); letter-spacing: -.005em; flex: none; }
.title em { color: var(--red); }
.caption { font: italic 400 19px/1.3 var(--serif); color: var(--text); flex: none; text-wrap: balance; }
.zone { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; touch-action: none; user-select: none; -webkit-user-select: none; }
.reveal { flex: none; min-height: 2.8em; display: flex; flex-direction: column; gap: 3px; transition: opacity .6s, transform .6s; }
.reveal small { font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.reveal b { font: 500 22px/1.2 var(--serif); }
.reveal.wait { opacity: 0; transform: translateY(8px); }

.act {
  position: relative; z-index: 5;
  appearance: none; flex: none; cursor: pointer; text-decoration: none;
  display: flex; justify-content: space-between; align-items: center; width: 100%; height: 56px; padding: 0 22px;
  border: 0; border-radius: 999px; background: var(--ink); color: var(--paper);
  font: 600 17px var(--sans);
  box-shadow: 0 3px 0 #000, 0 12px 18px -10px rgba(30,25,15,.5);
  transition: transform .1s, opacity .4s;
}
.act:active { transform: translateY(2px); box-shadow: 0 1px 0 #000, 0 8px 14px -10px rgba(30,25,15,.5); }
.act[disabled] { opacity: .14; pointer-events: none; }
.act svg { width: 22px; height: 12px; flex: none; }
.links { display: flex; justify-content: space-between; flex: none; }
.links button { appearance: none; border: 0; background: none; padding: 4px 2px; cursor: pointer; font: 500 13px var(--sans); color: var(--muted); }

/* Coin corné */
.corner { position: absolute; right: 0; bottom: 0; width: 64px; height: 64px; z-index: 4; cursor: grab; touch-action: none; opacity: 0; pointer-events: none; transition: opacity .4s; }
.corner::before { content: ""; position: absolute; right: 0; bottom: 0; width: 34px; height: 34px; background: linear-gradient(135deg, var(--paper-2) 0 50%, transparent 50%); box-shadow: -2px -2px 5px rgba(0,0,0,.14); border-radius: 0 0 10px 0; animation: curl 2.2s ease-in-out infinite; }
.corner.on { opacity: 1; pointer-events: auto; }
@keyframes curl { 50% { width: 46px; height: 46px; } }

/* Tourner la page */
.leaf { position: absolute; inset: 0; z-index: 8; pointer-events: none; transform-style: preserve-3d; transform-origin: left center; }
.leaf.auto { animation: flip .95s cubic-bezier(.42,.02,.24,1) forwards; }
.leaf.snap { transition: transform .45s cubic-bezier(.3,.6,.3,1); }
.leaf .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; animation: none !important; }
.leaf .light { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.22)); opacity: 0; z-index: 9; }
.leaf.auto .light { animation: light .95s forwards; }
.leaf .back { transform: rotateY(180deg); background: linear-gradient(270deg, rgba(0,0,0,.1), rgba(0,0,0,0) 28px), var(--paper-2); border-radius: 10px 2px 2px 10px; }
.cast { position: absolute; inset: 0; z-index: 7; pointer-events: none; background: linear-gradient(90deg, rgba(20,12,0,.3), rgba(20,12,0,0) 65%); opacity: 0; border-radius: 2px 10px 10px 2px; }
.cast.auto { animation: cast .95s forwards; }
@keyframes flip { to { transform: rotateY(-180deg); } }
@keyframes light { 50%, 100% { opacity: 1; } }
@keyframes cast { 0% { opacity: .2; } 45% { opacity: 1; } 100% { opacity: 0; } }

/* Ruban adhésif */
.tape { position: absolute; left: 50%; top: -11px; width: 78px; height: 22px; transform: translateX(-50%) rotate(-2deg); background: var(--tape); box-shadow: 0 1px 2px rgba(0,0,0,.08); z-index: 3; }

/* ---------- Accueil ---------- */
.home { height: 100%; display: flex; flex-direction: column; align-items: center; padding: 6px 0 20px; color: #fff; font-family: var(--sans); text-align: center; animation: rise .5s ease-out; }
.home .rb { align-self: flex-start; margin-left: 4px; }
.home h1 { font: 700 31px/1.12 var(--sans); letter-spacing: -.01em; margin-top: 6px; }
.home-sub { margin-top: 8px; display: flex; align-items: center; gap: 6px; font: 500 13px var(--sans); color: rgba(255,255,255,.66); }
.home-sub svg { width: 14px; height: 14px; }
.home .mid { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; }
.mini {
  width: 100%; aspect-ratio: 1.55; max-height: 100%; border-radius: 10px; padding: 7px 9px 9px 7px;
  background: repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 1px, transparent 1px 3px), linear-gradient(160deg, var(--brick), var(--brick-lo));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 34px 50px -20px rgba(6,8,22,.75), 0 10px 20px -8px rgba(6,8,22,.5);
  display: grid; grid-template-columns: 1fr 1fr; color: var(--ink); text-align: left;
}
.mini .pg { background: var(--paper); padding: 12px 10px 12px 14px; display: flex; flex-direction: column; justify-content: space-between; }
.mini .pg.left { border-radius: 6px 0 0 6px; background: linear-gradient(270deg, rgba(0,0,0,.16), rgba(0,0,0,.04) 22px, rgba(0,0,0,0) 60px), var(--paper); }
.mini .pg.right { border-radius: 0 6px 6px 0; background: linear-gradient(90deg, rgba(0,0,0,.16), rgba(0,0,0,.04) 22px, rgba(0,0,0,0) 60px), var(--paper); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 10px 12px 16px; align-content: center; }
.mini .k { font: 600 9px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mini .story { font: italic 400 14px/1.25 var(--serif); }
.mini .ico { display: flex; gap: 4px; align-items: flex-end; }
.mini .ico i { display: block; }
.snap { display: block; position: relative; background: #fff; padding: 3px 3px 9px; box-shadow: 0 2px 5px -1px rgba(0,0,0,.25); }
.snap:nth-child(1) { transform: rotate(-3deg); } .snap:nth-child(2) { transform: rotate(2deg); } .snap:nth-child(3) { transform: rotate(2.5deg); } .snap:nth-child(4) { transform: rotate(-2deg); }
.snap .art { display: block; aspect-ratio: 1; background: var(--paper-2); position: relative; overflow: hidden; }
.snap .art i { position: absolute; display: block; }
.snap .num { position: absolute; right: -6px; top: -6px; width: 18px; height: 18px; border-radius: 50%; background: #55524c; color: #fff; font: 600 8.5px/18px var(--sans); text-align: center; }
.ctrl { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; }
.pill { appearance: none; border: 0; cursor: pointer; height: 52px; padding: 0 26px; border-radius: 999px; background: #fff; color: var(--slate); font: 600 16px var(--sans); display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 20px -10px rgba(0,0,0,.6); }
.pill svg { width: 22px; height: 12px; }

/* ---------- 1. Pop-up : le nom se dresse ---------- */
.pop { position: relative; width: 100%; height: 100%; max-height: 360px; perspective: 650px; perspective-origin: 50% 0%; cursor: ns-resize; }
.pop .floor { position: absolute; left: 0; right: 0; bottom: 6%; height: 38%; background: var(--paper-2); transform: rotateX(60deg); transform-origin: 50% 100%; box-shadow: inset 0 0 0 1px var(--edge); }
.pop .floor::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: rgba(0,0,0,.2); }
.pop .scene { position: absolute; inset: 0; transform-style: preserve-3d; }
.pop .ly { position: absolute; transform-origin: 50% 100%; transform: rotateX(calc(-88deg * (1 - var(--q, 0)))); filter: drop-shadow(0 7px 5px rgba(30,20,5,.24)); }
.pop .ly1 { left: 46%; bottom: 46%; width: 36%; aspect-ratio: 1; border-radius: 50%; background: var(--red); }
.pop .ly2 { left: 12%; bottom: 44%; width: 28%; height: 42%; background: var(--slate); }
.pop .ly3 { left: 30%; bottom: 44%; width: 30%; height: 26%; background: var(--mustard); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.pop .ly4 { left: 62%; bottom: 44%; width: 26%; height: 44%; border: 3px solid var(--ink); border-bottom: 0; border-left: 0; border-radius: 0 100% 0 0; filter: none; }
.pop .word { position: absolute; left: 0; right: 0; bottom: 12%; text-align: center; line-height: .9; pointer-events: none; }
.pop .word .line { display: block; white-space: nowrap; }
.pop .lt { display: inline-block; transform-origin: 50% 100%; transform: rotateX(calc(-90deg * (1 - var(--q, 0)))); font-family: var(--serif); text-shadow: 0 4px 3px rgba(30,20,5,.18); }
.pop .l1 .lt { font-size: 50px; color: var(--red); font-style: italic; }
.pop .l2 .lt { font-size: 48px; color: var(--ink); font-weight: 500; }
.pop.anim .ly, .pop.anim .lt { transition: transform .6s cubic-bezier(.3,1.4,.5,1); }
.pop .hand { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); font: 500 13px var(--sans); color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
.pop .hand svg { animation: up 1.6s ease-in-out infinite; }
@keyframes up { 50% { transform: translateY(-8px); } }
.pop.done .hand { opacity: 0; }

/* ---------- 2. Tirette : billet ---------- */
.pull { position: relative; width: 100%; max-width: 290px; display: flex; flex-direction: column; align-items: center; margin-top: -24px; }
.pull .card {
  position: relative; z-index: 2; width: 100%; background: #fff; padding: 16px 18px 16px; transform: rotate(-1deg);
  box-shadow: 0 10px 22px -10px rgba(30,20,5,.45), 0 0 0 1px var(--edge);
}
.pull .t1 { display: flex; justify-content: space-between; font: 600 10px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 2px 0 10px; }
.pull .window { position: relative; height: 92px; overflow: hidden; background: var(--paper-2); box-shadow: inset 0 2px 4px rgba(0,0,0,.18); }
.pull .hatch { position: absolute; inset: 0; background: repeating-linear-gradient(135deg, var(--paper-2) 0 6px, #e4dccb 6px 7px); }
.pull .strip { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: var(--paper); transform: translateY(calc((var(--p, 0) - 1) * 100%)); }
.pull .strip span { font: 600 10px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pull .strip b { font: 500 32px/1.05 var(--serif); }
.pull .perf { margin-top: 12px; border-top: 1.5px dashed var(--faint); padding-top: 8px; font: 500 11px var(--sans); color: var(--muted); text-align: center; }
.pull .tab { position: relative; z-index: 1; margin-top: -4px; width: 108px; height: 64px; padding-top: 10px; background: var(--red); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 600 13px var(--sans); cursor: grab; touch-action: none; transform: translateY(calc(var(--p, 0) * var(--travel, 120px))); clip-path: polygon(0 0, 100% 0, 100% 78%, 50% 100%, 0 78%); }
.pull .tab::before { content: ""; position: absolute; left: 22%; right: 22%; bottom: 100%; height: 400px; background: #9a3a26; }
.pull .tab svg { animation: down 1.6s ease-in-out infinite; }
@keyframes down { 50% { transform: translateY(5px); } }
.pull.anim .strip, .pull.anim .tab { transition: transform .35s cubic-bezier(.3,.7,.3,1); }

/* ---------- 3. Rabat : polaroïd scotché qu'on soulève ---------- */
.flap-box { position: relative; width: 100%; max-width: 230px; aspect-ratio: 1; perspective: 900px; align-self: end; margin-bottom: 6px; }
.flap-under { position: absolute; inset: 0; background: #fff; box-shadow: inset 0 0 0 1px var(--edge), inset 0 8px 14px -8px rgba(0,0,0,.25); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; text-align: center; }
.flap-under span { font: 600 10px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.flap-under b { font: 500 36px/1 var(--serif); }
.flap-under em { font: italic 400 17px var(--serif); color: var(--text); }
.flap { position: absolute; inset: -6px; transform-origin: 50% 0; transform: rotateX(calc(var(--a, 0) * 1deg)); transform-style: preserve-3d; cursor: grab; touch-action: none; }
.flap .f, .flap .b { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flap .f { background: #fff; box-shadow: 0 10px 18px -8px rgba(30,20,5,.5), 0 0 0 1px var(--edge); transform: rotate(-1.5deg); }
.flap .art { position: absolute; inset: 9px 9px 40px; background: var(--slate); overflow: hidden; }
.flap .art i { position: absolute; display: block; }
.flap .art .s { width: 46%; aspect-ratio: 1; border-radius: 50%; background: var(--mustard); left: 12%; top: 14%; }
.flap .art .r { width: 22%; height: 70%; background: var(--red); right: 14%; bottom: 0; }
.flap .art .l { width: 80%; height: 2.5px; background: var(--ink); left: 6%; top: 68%; transform: rotate(-12deg); }
.flap .lab { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 8px; font: 600 13px var(--sans); color: var(--ink); }
.flap .lab svg { animation: up 1.6s ease-in-out infinite; }
.flap .b { transform: rotateX(180deg); background: var(--paper-2); }
.flap.anim { transition: transform .45s cubic-bezier(.3,.7,.3,1); }

/* ---------- 4. Roue (volvelle) ---------- */
.wheel { position: relative; width: min(100%, 290px); aspect-ratio: 1; touch-action: none; cursor: grab; filter: drop-shadow(0 14px 18px rgba(30,20,5,.38)); }
.wheel svg { width: 100%; height: 100%; display: block; overflow: visible; }
.wheel #rot { transform-box: view-box; transform-origin: 152px 152px; }
.wheel #rot.anim { transition: transform .4s cubic-bezier(.3,.7,.3,1); }
.wheel .top-disc { filter: drop-shadow(0 3px 3px rgba(0,0,0,.35)); }
.wheel .wl { font: 600 8.5px var(--sans); letter-spacing: .12em; fill: var(--muted); }
.wheel .wv { font: 500 17px var(--serif); fill: var(--ink); }
.wheel .wc { font: 600 8.5px var(--sans); letter-spacing: .3em; fill: var(--gold); }
.wheel .wh { font: italic 400 14px var(--serif); fill: rgba(233,224,204,.8); }
.seen { display: flex; gap: 7px; justify-content: center; flex: none; }
.seen i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); transition: background .3s; }
.seen i:nth-child(1).on { background: var(--red); }
.seen i:nth-child(2).on { background: var(--slate); }
.seen i:nth-child(3).on { background: var(--mustard); }
.seen i:nth-child(4).on { background: var(--ink); }

/* ---------- Invitation finale ---------- */
.inv-k { font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); flex: none; margin-top: -4px; }
.poster-wrap { flex: none; position: relative; padding: 0 6px; margin-top: 8px; }
.poster { position: relative; background: #fff; padding: 7px 7px 7px; box-shadow: 0 6px 14px -6px rgba(30,20,5,.35), 0 0 0 1px var(--edge); transform: rotate(-1.2deg); }
.poster .art { height: 92px; position: relative; overflow: hidden; background: var(--paper-2); }
.poster .art i { position: absolute; display: block; }
.poster .b { left: 8%; top: 18%; width: 18%; height: 120%; background: var(--slate); }
.poster .r { left: 34%; top: -30%; width: 34%; aspect-ratio: 1; border-radius: 50%; background: var(--red); }
.poster .y { right: 8%; bottom: 0; width: 26%; height: 64%; background: var(--mustard); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.poster .l { left: 20%; top: 58%; width: 70%; height: 2px; background: var(--ink); transform: rotate(-6deg); }
.info { margin: 0; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
.info div { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--faint); }
.info div:first-child { border-top: 1px solid var(--faint); }
.info dt { font: 600 10.5px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); flex: none; }
.info dd { margin: 0; text-align: right; font: 400 18px/1.2 var(--serif); }
.info dd.addr { user-select: all; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="app" id="app">
  <header class="bar" id="bar" hidden>
    <button class="rb" id="homeBtn" type="button" aria-label="Revenir à l'accueil"></button>
    <span class="bar-t" id="barT"></span>
    <span class="prog" id="prog"></span>
  </header>
  <div class="stage" id="stage" hidden><div class="book"><div class="pages" id="pages"></div></div></div>
  <section class="home" id="home" hidden></section>
</div>

<script>
/* ======== CONTENU (à modifier ici) ======== */
const ECOLE = { nom: "My Digital School", adresse: "40 rue du Chemin-Vert, 75011 Paris", rue: "40 rue du Chemin-Vert", ville: "75011 Paris" };
const EXPO = { nom: "L'art moderne", mot1: "L'art", mot2: "moderne", date: "Mercredi 18 novembre 2026", horaire: "15 h – 17 h", lieu: "Salle 2bis" };
const MAPS = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(ECOLE.nom + ", " + ECOLE.adresse);

/* ======== Icônes ======== */
const I = {
  book: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.6 3.5 5v13c3.5-.4 6.5 0 8.5 1.5 2-1.5 5-1.9 8.5-1.5V5C17 4.6 14 5 12 6.5Z"/><path d="M12 6.5v13"/></svg>`,
  redo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>`,
  pin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></svg>`,
  page: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3"/></svg>`,
  arrow: `<svg viewBox="0 0 22 12" aria-hidden="true"><path d="M0 6h20M15 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`,
  up: `<svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><path d="M7 17V2M2 7l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`,
  down: `<svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><path d="M7 1v15M2 11l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`
};

/* ======== Déroulé ======== */
const FLOW = ["home", "pop", "pull", "flap", "wheel", "invite"];
const ROMAN = ["I", "II", "III", "IV"];
let step = 0;
const done = {};
const pages = document.getElementById("pages");
const $ = (id) => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
$("homeBtn").innerHTML = I.book;
$("homeBtn").onclick = () => { step = 0; render(); };

function bar() {
  const n = Object.keys(done).length;
  $("barT").textContent = step <= 4 ? `Page ${step} sur 4` : "Invitation";
  $("prog").innerHTML = `${n}/4 <span class="slots">${[0, 1, 2, 3].map(i => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span>`;
}
function render(rise) {
  const isHome = FLOW[step] === "home";
  $("home").hidden = !isHome; $("bar").hidden = isHome; $("stage").hidden = isHome;
  if (isHome) return home();
  bar();
  ({ pop, pull, flap, wheel, invite })[FLOW[step]]();
  if (rise) pages.querySelector(".page").classList.add("rise");
}

/* ---------- Tourner la page (animé ou à la main) ---------- */
function makeLeaf() {
  const old = pages.querySelector(".page");
  if (!old || reduced) return null;
  const front = old.cloneNode(true);
  front.querySelectorAll("[id]").forEach(n => n.removeAttribute("id")); front.removeAttribute("id");
  front.querySelectorAll(".corner").forEach(n => n.remove());
  front.classList.remove("rise"); front.classList.add("face");
  const light = document.createElement("div"); light.className = "light"; front.appendChild(light);
  const back = document.createElement("div"); back.className = "face back";
  const leaf = document.createElement("div"); leaf.className = "leaf"; leaf.append(front, back);
  const cast = document.createElement("div"); cast.className = "cast";
  return { leaf, cast, light };
}
function turn(to) {
  const l = makeLeaf();
  step = to; render();
  if (l && FLOW[step] !== "home") {
    l.leaf.classList.add("auto"); l.cast.classList.add("auto");
    pages.append(l.cast, l.leaf);
    setTimeout(() => { l.leaf.remove(); l.cast.remove(); }, 1000);
  }
}
const next = () => turn(Math.min(step + 1, FLOW.length - 1));

function bindCorner() {
  const c = pages.querySelector(".corner"); if (!c) return;
  c.addEventListener("pointerdown", e => {
    if (!c.classList.contains("on")) return;
    e.preventDefault();
    const w = pages.getBoundingClientRect().width, x0 = e.clientX;
    const l = makeLeaf(); if (!l) { next(); return; }
    const from = step; step = from + 1; render();
    pages.append(l.cast, l.leaf);
    let ang = 0;
    const move = (ev) => {
      ang = clamp((x0 - ev.clientX) / (w * .85) * 180, 0, 180);
      l.leaf.style.transform = `rotateY(${-ang}deg)`;
      l.light.style.opacity = Math.min(1, ang / 90);
      l.cast.style.opacity = Math.sin(ang * Math.PI / 180);
    };
    const up = () => {
      removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
      const go = ang > 45;
      l.leaf.classList.add("snap"); l.cast.style.transition = "opacity .45s";
      l.leaf.style.transform = `rotateY(${go ? -180 : 0}deg)`; l.cast.style.opacity = 0;
      setTimeout(() => { l.leaf.remove(); l.cast.remove(); if (!go) { step = from; render(); } }, 470);
    };
    addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("pointercancel", up);
  });
}

function shell(title, ask, zone, small, big) {
  pages.innerHTML = `
    <div class="page">
      <h2 class="title">${title}</h2>
      <p class="caption" id="ask">${ask}</p>
      <div class="zone" id="zone">${zone}</div>
      <div class="reveal wait" id="rv"><small>${small}</small><b>${big}</b></div>
      <button class="act" id="nx" type="button" disabled>Tourner la page ${I.arrow}</button>
      <div class="corner" id="corner" aria-hidden="true"></div>
    </div>`;
  $("nx").onclick = next;
  bindCorner();
}
function complete(key) {
  done[key] = true; bar();
  $("rv").classList.remove("wait"); $("nx").disabled = false; $("corner").classList.add("on");
}

/* ---------- Accueil ---------- */
function home() {
  const snaps = [
    `<i style="left:22%;top:22%;width:56%;height:56%;border-radius:50%;background:var(--red)"></i>`,
    `<i style="left:16%;top:30%;width:68%;height:40%;background:#fff;box-shadow:0 0 0 1px var(--edge)"></i><i style="left:16%;top:30%;width:68%;height:5px;background:var(--slate)"></i>`,
    `<i style="left:18%;top:18%;width:64%;height:64%;background:var(--slate)"></i><i style="left:28%;top:28%;width:26%;aspect-ratio:1;border-radius:50%;background:var(--mustard)"></i>`,
    `<i style="left:14%;top:14%;width:72%;height:72%;border-radius:50%;background:conic-gradient(var(--red) 0 25%,var(--slate) 0 50%,var(--mustard) 0 75%,var(--ink) 0)"></i><i style="left:30%;top:30%;width:40%;height:40%;border-radius:50%;background:var(--slate)"></i>`
  ];
  $("home").innerHTML = `
    <span class="rb" aria-hidden="true">${I.book}</span>
    <h1>L'art moderne</h1>
    <p class="home-sub">${I.page}<span>Une invitation à ouvrir · ${ECOLE.nom}</span></p>
    <div class="mid">
      <div class="mini" aria-hidden="true">
        <div class="pg left">
          <span class="k">Exposition des élèves</span>
          <span class="ico"><i style="width:16px;height:22px;background:var(--slate)"></i><i style="width:18px;height:18px;border-radius:50%;background:var(--red)"></i><i style="width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid var(--mustard)"></i></span>
          <p class="story">Ce livre cache une invitation. Ouvrez-le pour la découvrir.</p>
        </div>
        <div class="pg right">${snaps.map((s, i) => `<span class="snap"><span class="art">${s}</span><span class="num">${ROMAN[i]}</span></span>`).join("")}</div>
      </div>
    </div>
    <div class="ctrl">
      <button class="rb" id="rst" type="button" aria-label="Recommencer depuis le début">${I.redo}</button>
      <button class="pill" id="go" type="button">Ouvrir le livre ${I.arrow}</button>
      <a class="rb" href="${MAPS}" target="_blank" rel="noopener" aria-label="Itinéraire Google Maps">${I.pin}</a>
    </div>`;
  $("go").onclick = () => { step = 1; render(true); };
  $("rst").onclick = () => { Object.keys(done).forEach(k => delete done[k]); step = 1; render(true); };
}

/* ---------- 1. Pop-up : le nom de l'exposition se dresse lettre par lettre ---------- */
function pop() {
  const letters = (w) => [...w].map(ch => `<span class="lt">${ch === " " ? "&nbsp;" : ch}</span>`).join("");
  shell("Le nom", "Glissez vers le haut pour soulever le papier.", `
    <div class="pop" id="pop" aria-label="${EXPO.nom}">
      <div class="floor"></div>
      <div class="scene">
        <div class="ly ly2"></div><div class="ly ly1"></div><div class="ly ly3"></div><div class="ly ly4"></div>
        <div class="word" aria-hidden="true"><span class="line l1">${letters(EXPO.mot1)}</span><span class="line l2">${letters(EXPO.mot2)}</span></div>
      </div>
      <div class="hand">${I.up}<span>Glissez vers le haut</span></div>
    </div>`, "Exposition des élèves", ECOLE.nom);
  const p = $("pop");
  const shapes = [...p.querySelectorAll(".ly")], lts = [...p.querySelectorAll(".lt")];
  const set = (v) => {
    shapes.forEach((el, i) => el.style.setProperty("--q", clamp((v - i * .06) / .55, 0, 1)));
    lts.forEach((el, i) => el.style.setProperty("--q", clamp((v - .2 - i * (.45 / lts.length)) / .35, 0, 1)));
  };
  if (done.pop) { set(1); p.classList.add("done"); complete("pop"); return; }
  set(0);
  let y0 = null, v0 = 0, cur = 0;
  p.addEventListener("pointerdown", e => { p.setPointerCapture(e.pointerId); p.classList.remove("anim"); y0 = e.clientY; v0 = cur; });
  p.addEventListener("pointermove", e => { if (y0 === null) return; cur = clamp(v0 + (y0 - e.clientY) / (p.clientHeight * .6), 0, 1); set(cur); });
  const up = (e) => {
    if (y0 === null) return;
    const tapped = Math.abs((e.clientY ?? y0) - y0) < 6;
    y0 = null; p.classList.add("anim");
    if (tapped || cur > .4) { cur = 1; set(1); if (!done.pop) { p.classList.add("done"); setTimeout(() => complete("pop"), 500); } }
    else { cur = 0; set(0); }
  };
  p.addEventListener("pointerup", up); p.addEventListener("pointercancel", up);
}

/* ---------- 2. Tirette : billet d'entrée ---------- */
function pull() {
  shell("La date", "Tirez la languette du billet vers le bas.", `
    <div class="pull" id="pull">
      <div class="card">
        <span class="tape"></span>
        <div class="t1"><span>Billet d'entrée</span><span>${EXPO.nom}</span></div>
        <div class="window"><div class="hatch"></div><div class="strip"><span>Rendez-vous le</span><b>18 novembre</b></div></div>
        <div class="perf">${EXPO.lieu} · ${ECOLE.nom}</div>
      </div>
      <div class="tab" id="tab"><span>Tirez</span>${I.down}</div>
    </div>`, "Date", EXPO.date);
  const box = $("pull"), tab = $("tab");
  // La languette ne descend jamais plus bas que la zone : elle ne recouvre ni le texte ni le bouton
  const zb = $("zone").getBoundingClientRect(), tb = tab.getBoundingClientRect();
  const T = clamp(zb.bottom - tb.bottom - 4, 36, 110);
  const travel = () => T;
  box.style.setProperty("--travel", travel() + "px");
  const set = (v) => box.style.setProperty("--p", v);
  const finish = () => { tab.style.pointerEvents = "none"; if (!done.pull) setTimeout(() => complete("pull"), 250); };
  if (done.pull) { set(1); tab.style.pointerEvents = "none"; complete("pull"); return; }
  let y0 = null, cur = 0, moved = false;
  tab.addEventListener("pointerdown", e => { tab.setPointerCapture(e.pointerId); box.classList.remove("anim"); y0 = e.clientY - cur * travel(); moved = false; });
  tab.addEventListener("pointermove", e => { if (y0 === null) return; const v = clamp((e.clientY - y0) / travel(), 0, 1); if (Math.abs(v - cur) > .02) moved = true; cur = v; set(cur); });
  const up = () => {
    if (y0 === null) return;
    y0 = null; box.classList.add("anim");
    if (cur > .5 || !moved) { cur = 1; set(1); finish(); }
    else { cur = 0; set(0); }
  };
  tab.addEventListener("pointerup", up); tab.addEventListener("pointercancel", up);
}

/* ---------- 3. Rabat : soulever le polaroïd ---------- */
function flap() {
  shell("L'horaire", "Soulevez le tableau scotché.", `
    <div class="flap-box">
      <div class="flap-under"><span>Ouvert</span><b>15 h – 17 h</b><em>${EXPO.lieu}</em></div>
      <div class="flap" id="flap"><div class="f"><div class="art"><i class="s"></i><i class="r"></i><i class="l"></i></div><div class="lab">${I.up}<span>Soulevez</span></div></div><div class="b"></div></div>
      <span class="tape" style="top:-16px"></span>
    </div>`, "Horaire", EXPO.horaire + " · " + EXPO.lieu);
  const f = $("flap");
  const set = (a) => f.style.setProperty("--a", a);
  if (done.flap) { set(125); f.style.pointerEvents = "none"; complete("flap"); return; }
  let y0 = null, a0 = 0, cur = 0;
  f.addEventListener("pointerdown", e => { f.setPointerCapture(e.pointerId); f.classList.remove("anim"); y0 = e.clientY; a0 = cur; });
  f.addEventListener("pointermove", e => { if (y0 === null) return; cur = clamp(a0 + (y0 - e.clientY) / f.clientHeight * 150, 0, 125); set(cur); });
  const up = (e) => {
    if (y0 === null) return;
    const tapped = Math.abs((e.clientY ?? y0) - y0) < 6; y0 = null; f.classList.add("anim");
    if (cur > 60 || tapped) { cur = 125; set(125); f.style.pointerEvents = "none"; if (!done.flap) setTimeout(() => complete("flap"), 350); }
    else { cur = 0; set(0); }
  };
  f.addEventListener("pointerup", up); f.addEventListener("pointercancel", up);
}

/* ---------- 4. Roue : tourner pour lire l'adresse ---------- */
function wheelSVG(parts) {
  const C = 152, pol = (r, a) => [C + r * Math.sin(a * Math.PI / 180), C - r * Math.cos(a * Math.PI / 180)];
  const arc = (r1, r2, a1, a2) => { const [x1, y1] = pol(r2, a1), [x2, y2] = pol(r2, a2), [x3, y3] = pol(r1, a2), [x4, y4] = pol(r1, a1);
    return `M${x1} ${y1}A${r2} ${r2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 0 0 ${x4} ${y4}Z`; };
  const cols = ["var(--red)", "var(--slate)", "var(--mustard)", "var(--ink)"];
  let ticks = "";
  for (let a = 0; a < 360; a += 5) { const long = a % 15 === 0; const [x1, y1] = pol(long ? 140 : 143.5, a), [x2, y2] = pol(148, a); ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1f2328" stroke-width="${long ? 1 : .6}" opacity="${long ? .7 : .45}"/>`; }
  const arcs = cols.map((c, q) => `<path d="${arc(130, 136.5, q * 90 - 42, q * 90 + 42)}" fill="${c}"/>`).join("");
  const labels = parts.map((p, i) => {
    const vals = p[1].length === 1 ? `<text class="wv" x="152" y="90" text-anchor="middle">${p[1][0]}</text>`
      : `<text class="wv" x="152" y="82" text-anchor="middle">${p[1][0]}</text><text class="wv" x="152" y="100" text-anchor="middle">${p[1][1]}</text>`;
    return `<g transform="rotate(${i * 90} 152 152)"><text class="wl" x="152" y="58" text-anchor="middle">${p[0].toUpperCase()}</text>${vals}</g>`;
  }).join("");
  return `
  <svg viewBox="0 0 304 304" aria-hidden="true">
    <defs>
      <radialGradient id="gold" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#f6e4b4"/><stop offset=".6" stop-color="#b8924a"/><stop offset="1" stop-color="#8a6a2e"/></radialGradient>
      <path id="curve" d="M55 208A112 112 0 0 0 249 208"/>
    </defs>
    <g id="rot">
      <circle cx="152" cy="152" r="150" fill="#fbf8f1" stroke="#ddd6c8"/>
      ${arcs}${ticks}
      <circle cx="152" cy="152" r="126" fill="none" stroke="#ddd6c8" stroke-width=".8"/>
      ${labels}
    </g>
    <g class="top-disc">
      <path fill="#3d4466" fill-rule="evenodd" d="M152 30a122 122 0 1 0 .01 0Z M106 36H198a6 6 0 0 1 6 6V110a6 6 0 0 1-6 6H106a6 6 0 0 1-6-6V42a6 6 0 0 1 6-6Z"/>
      <circle cx="152" cy="152" r="116" fill="none" stroke="#d9bf86" stroke-width=".7" opacity=".7"/>
      <rect x="100" y="36" width="104" height="80" rx="6" fill="none" stroke="#d9bf86" stroke-width="1.3"/>
      <text class="wc"><textPath href="#curve" startOffset="50%" text-anchor="middle">L'ART MODERNE · 2026</textPath></text>
      <text class="wh" id="th" x="152" y="182" text-anchor="middle">↻ tournez la roue</text>
    </g>
    <path d="M146 20l6 8 6-8Z" fill="#d9bf86" stroke="#8a6a2e" stroke-width=".6"/>
    <circle cx="152" cy="152" r="9" fill="url(#gold)" stroke="#7a5d27" stroke-width=".6"/>
    <circle cx="149.5" cy="149.5" r="2" fill="#fff6dc" opacity=".7"/>
  </svg>`;
}
function wheel() {
  const parts = [["L'école", ["My Digital", "School"]], ["Adresse", ["40 rue du", "Chemin-Vert"]], ["Ville", ["75011", "Paris"]], ["Salle", ["Salle 2bis"]]];
  shell("L'adresse", "Tournez la roue pour lire l'adresse.", `<div class="wheel" id="wh" role="slider" aria-label="Roue de l'adresse" tabindex="0">${wheelSVG(parts)}</div>`, "Adresse", ECOLE.adresse);
  const wh = $("wh"), rg = wh.querySelector("#rot");
  const dotsEl = document.createElement("div"); dotsEl.className = "seen"; dotsEl.innerHTML = parts.map(() => "<i></i>").join("");
  $("rv").before(dotsEl);
  const seen = new Set();
  let rot = 0;
  const mark = () => {
    const idx = ((Math.round(-rot / 90) % 4) + 4) % 4;
    seen.add(idx);
    dotsEl.querySelectorAll("i").forEach((d, i) => d.classList.toggle("on", seen.has(i)));
    if (seen.size === 4 && !done.wheel) complete("wheel");
  };
  const setR = (r) => { rot = r; rg.style.transform = `rotate(${r}deg)`; };
  const hideHint = () => { const t = wh.querySelector("#th"); if (t) t.style.display = "none"; };
  if (done.wheel) { [0, 1, 2, 3].forEach(i => seen.add(i)); mark(); hideHint(); return; }
  mark();
  let a0 = null, r0 = 0;
  const ang = (e) => { const b = wh.getBoundingClientRect(); return Math.atan2(e.clientY - (b.top + b.height / 2), e.clientX - (b.left + b.width / 2)) * 180 / Math.PI; };
  wh.addEventListener("pointerdown", e => { wh.setPointerCapture(e.pointerId); rg.classList.remove("anim"); a0 = ang(e); r0 = rot; hideHint(); });
  wh.addEventListener("pointermove", e => {
    if (a0 === null) return;
    let d = ang(e) - a0; if (d > 180) d -= 360; if (d < -180) d += 360;
    setR(r0 + d); a0 = ang(e); r0 = rot; mark();
  });
  const up = () => { if (a0 === null) return; a0 = null; rg.classList.add("anim"); setR(Math.round(rot / 90) * 90); mark(); };
  wh.addEventListener("pointerup", up); wh.addEventListener("pointercancel", up);
  wh.addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === "ArrowLeft") { rg.classList.add("anim"); setR(rot + (e.key === "ArrowRight" ? -90 : 90)); mark(); } });
}

/* ---------- Invitation finale ---------- */
function invite() {
  pages.innerHTML = `
    <div class="page">
      <h2 class="title" style="font-size:38px"><em>${EXPO.mot1}</em> ${EXPO.mot2}</h2>
      <span class="inv-k">Exposition des élèves · ${ECOLE.nom}</span>
      <div class="poster-wrap" aria-hidden="true"><div class="poster"><span class="tape"></span><div class="art"><i class="b"></i><i class="r"></i><i class="y"></i><i class="l"></i></div></div></div>
      <dl class="info">
        <div><dt>Date</dt><dd>${EXPO.date}</dd></div>
        <div><dt>Horaire</dt><dd>${EXPO.horaire}</dd></div>
        <div><dt>Lieu</dt><dd>${EXPO.lieu}</dd></div>
        <div><dt>Adresse</dt><dd class="addr" id="addr">${ECOLE.rue}<br>${ECOLE.ville}</dd></div>
      </dl>
      <a class="act" href="${MAPS}" target="_blank" rel="noopener">Y aller avec Google Maps ${I.arrow}</a>
      <div class="links"><button id="copy" type="button">Copier l'adresse</button><button id="again" type="button">Recommencer</button></div>
    </div>`;
  $("again").onclick = () => { Object.keys(done).forEach(k => delete done[k]); step = 0; render(); };
  $("copy").onclick = async () => {
    const b = $("copy");
    try { await navigator.clipboard.writeText(ECOLE.nom + ", " + ECOLE.adresse); b.textContent = "Adresse copiée"; }
    catch (e) { const r = document.createRange(); r.selectNodeContents($("addr")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Adresse sélectionnée"; }
  };
}

render();
